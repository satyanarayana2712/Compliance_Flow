spring:
  application:
    name: complianceautomationplatform

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/compliance_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
    show-sql: true
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  shutdown: graceful

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

# Suppress noisy framework logs — your own app logs stay at INFO
logging:
  level:
    root: WARN
    com.abhiram.complianceautomationplatform: INFO
    org.hibernate.orm.connections.pooling: WARN
    org.hibernate.orm.core: WARN
    org.hibernate.orm.jpa: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.springdoc: WARN